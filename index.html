<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLB Cinematic Viewer</title>

  <!-- THREE.JS IMPORT MAP -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eeeeee;
      font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Loading overlay */
    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #111213;
      color: #f2f2f2;
      z-index: 100;
      transition: opacity 0.8s ease;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #loading-title {
      font-size: 15px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.6;
    }

    #loading-percent {
      font-size: 14px;
      opacity: 0.85;
    }

    #loading-bar-track {
      width: 240px;
      height: 2px;
      background: rgba(255, 255, 255, 0.15);
      margin-top: 6px;
      overflow: hidden;
    }

    #loading-bar-fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      transition: width 0.15s ease-out;
    }

    /* Error box */
    #error {
      display: none;
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 15px;
      max-width: 500px;
      background: #ffdddd;
      color: #990000;
      border: 1px solid #ff9999;
      border-radius: 6px;
      font-size: 13px;
      z-index: 200;
    }
    /* Debug overlay — live camera position/rotation readout */
    #camera-debug {
      position: fixed;
      bottom: 16px;
      left: 16px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.72);
      color: #b6ffb6;
      font-family: "Consolas", "Menlo", monospace;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre;
      border-radius: 6px;
      z-index: 50;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- LOADING SCREEN -->
  <div id="loading-screen">
    <div id="loading-title">Loading Experience</div>
    <div id="loading-percent">Loading model... 0%</div>
    <div id="loading-bar-track">
      <div id="loading-bar-fill"></div>
    </div>
  </div>

  <!-- ERROR MESSAGE -->
  <div id="error"></div>

  <!-- CAMERA DEBUG OVERLAY (position/rotation, updated live) -->
  <div id="camera-debug"></div>

  <!-- MAIN LOGIC -->
  <script type="module" src="./js/main.js"></script>
  <script type="module" src="./js/layout-selector.js"></script>
  <script type="module" src="./js/axis-gizmo.js"></script>
</body>
</html>
